[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ownwords"
version = "0.1.0"
description = "Rewrite machine-sounding text without changing what it says, and prove it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Patricia Kusch" }]
dependencies = []
keywords = ["writing", "editing", "plain-english", "fact-checking", "agent-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/patkusch/ownwords"
Issues = "https://github.com/patkusch/ownwords/issues"
Changelog = "https://github.com/patkusch/ownwords/blob/main/CHANGELOG.md"

[project.scripts]
ownwords = "ownwords.cli:main"

[tool.setuptools]
packages = ["ownwords"]

[tool.setuptools.package-data]
ownwords = ["tells.json"]
