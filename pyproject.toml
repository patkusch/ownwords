[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ownwords"
version = "0.1.0"
description = "Rewrite machine-sounding text without changing what it says, and prove it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Patricia Kusch" }]
dependencies = []

[project.scripts]
ownwords = "ownwords.cli:main"

[tool.setuptools]
packages = ["ownwords"]

[tool.setuptools.package-data]
ownwords = ["tells.json"]
